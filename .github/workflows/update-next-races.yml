name: Update next-race data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-next-race-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch netkeiba next-race data
        run: node scripts/fetch-next-races.mjs
      - name: Commit updated data
        run: |
          if git diff --quiet -- app/next-races.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/next-races.json
          git commit -m "Update next-race data"
          git push
